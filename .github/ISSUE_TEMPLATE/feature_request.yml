name: Предложение
description: Предложить улучшение AudioPatch
title: "[Feature] "
body:
  - type: textarea
    id: use_case
    attributes:
      label: Задача
      description: Какую реальную задачу маршрутизации требуется решить?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Ожидаемое поведение
      description: Опишите устройства, каналы, частоты и критерий успешной работы.
    validations:
      required: true
